[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-mcp-kz"
version = "0.1.0"
description = "Local MCP server for Kazakh bank statements"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "pdfplumber>=0.11,<0.12"]

[project.scripts]
finance-mcp-kz = "finance_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_mcp = ["*.sql", "py.typed"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
